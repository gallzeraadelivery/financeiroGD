name: financeiro-gd
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeiro -d financeiro"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
  web:
    build: .
    container_name: financeiro-gd-web
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    networks: [private, web]
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "manage.py", "run_scheduler"]
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
volumes:
  database:
networks:
  private:
  web:
    external: true
    name: gdnew_web
